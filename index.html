<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rivers first, cities after — an atlas of the ancient world</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#07161a;
  --deep:#0b2026;
  --land:#14282c;
  --edge:#23474c;
  --water:#6fe0dc;
  --water-hi:#cdf8f3;
  --clay:#e0a33c;
  --madder:#dd6440;
  --bone:#eaf0ec;
  --fog:#8ba5a2;
  --serif:'EB Garamond','Palatino Linotype',Palatino,'Iowan Old Style',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--abyss);color:var(--bone);
  font-family:var(--serif);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--clay);outline-offset:3px}

/* ---------- map ---------- */
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
svg{display:block;width:100%;height:100%}
.grat{fill:none;stroke:#12333a;stroke-width:.6px;vector-effect:non-scaling-stroke}
.land{fill:var(--land);stroke:var(--edge);stroke-width:.7px;vector-effect:non-scaling-stroke}
.lake{fill:var(--deep);stroke:#2b5157;stroke-width:.6px;vector-effect:non-scaling-stroke}

#riverGlow path{fill:none;stroke:var(--water);stroke-opacity:.16;stroke-width:5px;
  stroke-linecap:round;vector-effect:non-scaling-stroke}
#riverBase path{fill:none;stroke:var(--water);stroke-opacity:.85;stroke-width:1.25px;
  stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;
  transition:stroke-dashoffset 1.5s cubic-bezier(.3,.7,.3,1)}
#riverBase g.dry path{stroke-opacity:.5;stroke-dasharray:4.5 4.5}
#riverGlow g.dry path{stroke-opacity:.05}
#riverBase g.on path,#riverGlow g.on path{stroke:var(--water-hi)}
#riverGlow g.on path{stroke-opacity:.4}
#riverFlow{fill:none;stroke:var(--water-hi);stroke-width:2.2px;stroke-linecap:round;
  vector-effect:non-scaling-stroke;opacity:0;transition:opacity .35s}
#riverFlow.on{opacity:.95}

.hydro{font-family:var(--serif);font-style:italic;font-weight:500;fill:#9fe6e2;
  letter-spacing:.09em;text-anchor:middle;paint-order:stroke;stroke:var(--abyss);
  stroke-width:3px;stroke-linejoin:round;pointer-events:none;opacity:0;transition:opacity .3s}
.hydro.vis{opacity:.92}
.hydro.on{fill:var(--water-hi);opacity:1}
.hydro.alt{font-style:normal;font-family:var(--mono);letter-spacing:.14em;fill:#6f9d9a;
  text-transform:uppercase}
.rhit{fill:none;stroke:transparent;stroke-width:7px;vector-effect:non-scaling-stroke;
  cursor:pointer;pointer-events:stroke}

.mdot{fill:none;stroke:#9fb8b4;stroke-width:1.1px;vector-effect:non-scaling-stroke}
.mlab{font-family:var(--mono);fill:#93aaa6;letter-spacing:.08em;text-transform:uppercase;
  text-anchor:end;
  paint-order:stroke;stroke:var(--abyss);stroke-width:3px;stroke-linejoin:round;
  pointer-events:none;opacity:0;transition:opacity .25s}
#modern{opacity:0;pointer-events:none;transition:opacity .4s}
#modern.on{opacity:1}

.tip{position:fixed;z-index:20;max-width:250px;pointer-events:none;opacity:0;
  transition:opacity .16s;background:rgba(7,22,26,.97);border:1px solid #2c5257;
  padding:11px 13px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tip.on{opacity:1}
.tip img{display:block;width:100%;height:78px;object-fit:cover;margin:-11px -13px 9px;
  width:calc(100% + 26px);filter:saturate(.8) contrast(1.04) brightness(.92)}
.tip b{display:block;font-size:19px;font-weight:500;line-height:1.05;letter-spacing:-.01em}
.tip i{display:block;font-size:14.5px;color:#a9e4e0;margin-top:2px}
.tip em{display:block;font-family:var(--mono);font-size:9.5px;font-style:normal;
  letter-spacing:.13em;text-transform:uppercase;color:var(--clay);margin-top:7px}
.tip .tr{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--madder);margin-top:6px}
.tip .tp{display:block;font-size:13px;color:#8ba5a2;margin-top:4px}
.tip .tg{display:block;font-size:13.5px;line-height:1.35;color:#a8bcb8;margin-top:7px}
.tip .th{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;
  text-transform:uppercase;color:#5f7d7a;margin-top:9px}

.dot{fill:var(--clay);stroke:#3a2606;stroke-width:.5px;vector-effect:non-scaling-stroke;
  transition:fill .2s,opacity .45s}
.mark.t3 .dot{fill:none;stroke:var(--clay);stroke-width:1.3px}
.halo{fill:none;stroke:var(--clay);stroke-opacity:.5;stroke-width:1px;
  vector-effect:non-scaling-stroke;transition:opacity .45s}
.mark.off .halo{opacity:.06}
.mark.hot .halo,.mark.sel .halo{stroke:var(--madder);stroke-opacity:.9}
.hit{fill:transparent;cursor:pointer}
.mark.off .dot{opacity:.09}
.mark.insys .dot{fill:#ffcf7d}
.mark.hot .dot,.mark.sel .dot{fill:var(--madder)}
.ring{fill:none;stroke:var(--madder);stroke-width:1.7px;vector-effect:non-scaling-stroke;opacity:0}
.mark.sel .ring{opacity:.9;animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{opacity:.9;r:var(--r0)}100%{opacity:0;r:var(--r1)}}
.slab{font-family:var(--mono);fill:#f4e6ca;letter-spacing:.03em;
  paint-order:stroke;stroke:var(--abyss);stroke-width:3.5px;stroke-linejoin:round;
  pointer-events:none;opacity:0;transition:opacity .25s}
#marks.bloom .mark .dot{opacity:0}

/* ---------- masthead ---------- */
.mast{position:fixed;top:0;left:0;padding:22px 26px 0;transition:opacity .5s;
  pointer-events:none;z-index:5}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;color:var(--fog);
  text-transform:uppercase;margin:0 0 12px}
.mast h1{font-size:clamp(25px,3.3vw,43px);line-height:.98;margin:0;font-weight:500;
  letter-spacing:-.015em;white-space:nowrap}
.mast h1 em{font-style:italic;color:var(--water)}
.tally{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;color:var(--fog);
  margin:16px 0 0;text-transform:uppercase;line-height:1.75;white-space:nowrap}

/* ---------- panel ---------- */
.panel{position:fixed;top:0;right:0;width:352px;height:100%;z-index:6;
  background:linear-gradient(to left,rgba(7,22,26,.97),rgba(7,22,26,.88));
  backdrop-filter:blur(9px);border-left:1px solid #1d3b40;
  display:flex;flex-direction:column}
.p-head{padding:20px 22px 12px;border-bottom:1px solid #163338;flex:0 0 auto}
.p-head .eyebrow{margin:0}
.p-body{overflow-y:auto;padding:4px 22px 26px;flex:1 1 auto;scrollbar-width:thin;
  scrollbar-color:#2a4d52 transparent}
.p-body::-webkit-scrollbar{width:7px}
.p-body::-webkit-scrollbar-thumb{background:#2a4d52;border-radius:4px}

.reg{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--fog);
  text-transform:uppercase;margin:22px 0 8px;padding-bottom:5px;border-bottom:1px solid #163338}
.p-body > .reg:first-child{margin-top:14px}
.intro{font-size:15.5px;line-height:1.45;color:#c2d3cf;margin:16px 0 2px}
.intro + .reg{margin-top:18px}
.cradle{display:block;width:100%;text-align:left;padding:7px 0 8px;border-bottom:1px solid #102a2e}
.cradle:hover .cn,.cradle[aria-current=true] .cn{color:var(--water-hi)}
.cradle .row{display:flex;align-items:baseline;gap:8px}
.cn{font-style:italic;font-size:17px;color:#a9e4e0;transition:color .2s;flex:1 1 auto}
.cc{font-family:var(--mono);font-size:9.5px;color:var(--fog);flex:0 0 auto}
.span{position:relative;height:2px;background:#14343a;margin-top:7px;border-radius:2px}
.span i{position:absolute;top:0;height:2px;background:var(--clay);border-radius:2px;opacity:.75}

.card .kicker{font-family:var(--mono);font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--madder);margin:16px 0 6px}
.card h2{font-size:29px;line-height:1.02;margin:0;font-weight:500;letter-spacing:-.01em}
.card .culture{font-style:italic;font-size:17px;color:#a9e4e0;margin:5px 0 0}
.dl{margin:18px 0 0;border-top:1px solid #163338}
.dl div{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #102a2e}
.dl dt{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--fog);width:74px;flex:0 0 auto;padding-top:3px}
.dl dd{margin:0;font-size:15.5px;line-height:1.35}
.card .note{font-size:16px;line-height:1.5;color:#cfdcd8;margin:16px 0 0}
.shot{position:relative;margin:16px 0 0;background:#0e2429;border:1px solid #1d3b40;
  height:150px;overflow:hidden}
.shot img{display:block;width:100%;height:150px;object-fit:cover;
  filter:saturate(.82) contrast(1.05) brightness(.9);opacity:0;transition:opacity .5s}
.shot img.in{opacity:1}
.shot.empty{height:auto;border-style:dashed;background:none}
.shot.empty .cap{position:static;padding:9px 10px;background:none;line-height:1.6}
.shot.empty .cap a{color:var(--water)}
.card .role{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--madder);margin:9px 0 0;line-height:1.5}
.card .culture{margin-top:6px}
.shot .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 6px;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;
  color:#b9cbc7;background:linear-gradient(to top,rgba(6,18,21,.92),transparent)}
.desc{font-size:14.5px;line-height:1.4;color:#9fb5b1;font-style:italic;margin:10px 0 0}
.wlink{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--water);text-decoration:none;margin:16px 0 0;
  border-bottom:1px solid #2a4d52;padding-bottom:3px}
.wlink:hover{color:var(--water-hi);border-color:var(--water)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:#9fb5b1;
  border:1px solid #24464b;border-radius:2px;padding:4px 7px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:#d7e2df;
  border:1px solid #29494e;border-radius:2px;padding:4px 8px}
.chip:hover{border-color:var(--clay);color:var(--clay)}
.back{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--fog);margin:20px 0 0;display:inline-block}
.back:hover{color:var(--bone)}

/* ---------- timeline ---------- */
.tl{position:fixed;bottom:0;left:0;right:352px;z-index:5;padding:0 26px 20px;
  display:flex;align-items:flex-end;gap:20px}
.yr{flex:0 0 auto;width:158px}
.yr b{display:block;font-family:var(--mono);font-size:26px;font-weight:400;
  letter-spacing:-.01em;line-height:1;color:var(--clay);font-variant-numeric:tabular-nums}
.yr b.all{color:var(--bone);font-size:19px;letter-spacing:.02em}
.yr span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--fog);margin-top:7px}
.track{flex:1 1 auto;position:relative;height:44px;cursor:pointer;touch-action:none}
.track .rail{position:absolute;left:0;right:0;top:21px;height:1px;background:#26474c}
.track .fill{position:absolute;left:0;top:20px;height:3px;background:var(--clay);
  opacity:.55;border-radius:2px;width:0}
.track .tk{position:absolute;top:14px;width:1px;height:8px;background:#2d5157}
.track .tl-lab{position:absolute;top:27px;transform:translateX(-50%);
  font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:#5f7d7a;white-space:nowrap}
.track .pip{position:absolute;top:17px;width:3px;height:9px;background:var(--water);
  opacity:.5;border-radius:1px;transform:translateX(-1px)}
.track .knob{position:absolute;top:12px;width:2px;height:19px;background:var(--bone);
  transform:translateX(-1px);box-shadow:0 0 0 3px rgba(7,22,26,.8)}
.track .knob::after{content:'';position:absolute;left:-5px;top:-8px;width:12px;height:8px;
  background:var(--bone);clip-path:polygon(50% 100%,0 0,100% 0)}
.track.off .knob,.track.off .fill{display:none}
.tl-btns{flex:0 0 auto;display:flex;gap:8px;padding-bottom:8px}
.tbtn{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--fog);border:1px solid #26474c;border-radius:2px;padding:6px 8px;white-space:nowrap}
.tbtn:hover{color:var(--bone);border-color:#3d6b70}
.tbtn.hot{color:var(--clay);border-color:#6b5220}

/* ---------- legend ---------- */
.legend{position:fixed;left:26px;bottom:92px;z-index:5;transition:opacity .5s;font-family:var(--mono);
  font-size:9.5px;letter-spacing:.09em;color:var(--fog);pointer-events:none}
.legend div{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.legend i{display:block;flex:0 0 auto;width:22px}
.lg-riv{height:0;border-top:1.5px solid var(--water)}
.lg-dry{height:0;border-top:1.5px dashed rgba(111,224,220,.55)}
.lg-dot{width:22px;text-align:center;color:var(--clay);font-size:12px;font-style:normal}

.sheet-tab{display:none}
@media (max-width:900px){
  .mast{max-width:none;width:100%;padding:14px 18px 0}
  .tally{margin-top:9px;font-size:8.5px}
  .panel{top:auto;bottom:0;width:100%;height:42vh;border-left:0;border-top:1px solid #1d3b40;
    transform:translateY(calc(100% - 46px));transition:transform .32s cubic-bezier(.3,.8,.3,1)}
  .panel.open{transform:translateY(0)}
  .sheet-tab{display:flex;align-items:center;justify-content:space-between;width:100%;
    padding:14px 18px;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--fog);border-bottom:1px solid #163338}
  .p-head{display:none}
  .p-body{padding:0 18px 24px}
  .tl{right:0;top:43%;bottom:auto;padding:0 18px 8px;flex-wrap:wrap;gap:10px}
  .sheet-tab span:last-child{transition:transform .3s}
  .panel.open .sheet-tab span:last-child{transform:rotate(180deg)}
  .yr{width:auto;flex:1 1 auto}
  .yr b{font-size:20px}
  .track{flex:1 1 100%;order:3}
  .legend{display:none}
  .tl-lab.minor{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="stage">
  <svg id="map" aria-label="World map of ancient river systems and the civilizations along them">
    <g id="scene">
      <g id="grat"></g>
      <g id="lands"></g>
      <g id="lakes"></g>
      <g id="riverGlow"></g>
      <g id="riverBase"></g>
      <path id="riverFlow"></path>
      <g id="hydros"></g>
      <g id="riverHit"></g>
      <g id="modern" aria-hidden="true"></g>
      <g id="marks" aria-hidden="true"></g>
    </g>
  </svg>
</div>

<header class="mast">
  <p class="eyebrow">Water &amp; settlement</p>
  <h1>Rivers first,<br><em>cities after</em></h1>
  <p class="tally" id="tally"></p>
</header>

<aside class="panel" id="panel">
  <button class="sheet-tab" id="sheetTab"><span id="sheetLabel">The cradles</span><span>&#9650;</span></button>
  <div class="p-head"><p class="eyebrow" id="pKicker">Thirty-three cradles</p></div>
  <div class="p-body" id="pBody"></div>
</aside>

<div class="tl">
  <div class="yr">
    <b class="all" id="yrOut">All time</b>
    <span id="yrSub">10,000 BCE – 1600 CE</span>
  </div>
  <div class="track off" id="track" role="slider" tabindex="0" aria-label="Year"
       aria-valuemin="-10000" aria-valuemax="1600" aria-valuenow="1600">
    <div class="rail"></div><div class="fill" id="fill"></div>
    <div id="ticks"></div><div id="pips"></div>
    <div class="knob" id="knob"></div>
  </div>
  <div class="tl-btns">
    <button class="tbtn" id="playBtn">Sweep time</button>
    <button class="tbtn" id="allBtn">All time</button>
    <button class="tbtn" id="modBtn" aria-pressed="false">Modern cities</button>
    <button class="tbtn" id="fitBtn">Fit world</button>
  </div>
</div>

<div class="tip" id="tip" role="tooltip" aria-hidden="true"></div>
<div class="legend">
  <div><i class="lg-riv"></i><span>River system</span></div>
  <div><i class="lg-dry"></i><span>Channel now dry</span></div>
  <div><i class="lg-dot" style="font-size:14px">&#9673;</i><span>Capital or metropolis</span></div>
  <div><i class="lg-dot">&#9679;</i><span>City or ceremonial centre</span></div>
  <div><i class="lg-dot" style="font-size:10px">&#9675;</i><span>Village or minor site</span></div>
  <div id="lgMod" style="display:none"><i class="lg-dot" style="color:#9fb8b4">&#9675;</i><span>Modern city</span></div>
</div>

const WC={};
/* Wikimedia's image host is sometimes unreachable from an embedded frame, so keep
   several routes to the same picture and use whichever one actually loads. */
function commonsURLs(f){
  f=String(f).replace(/^\s*(File|Image)\s*:\s*/i,'').replace(/ /g,'_');
  const e=encodeURIComponent(f);
  return ['https://commons.wikimedia.org/wiki/Special:FilePath/'+e+'?width=800',
          'https://en.wikipedia.org/wiki/Special:Redirect/file/'+e+'?width=800'];
}
function override(name){
  const has=Object.prototype.hasOwnProperty.call(IMG,name);
  const e=has?IMG[name]:undefined;
  if(!has||e===undefined)return {urls:[],cap:null,off:false};
  if(e===false||e===null||e==='')return {urls:[],cap:null,off:true};
  const v=Array.isArray(e)?e[0]:e, cap=Array.isArray(e)?(e[1]||null):null;
  return {urls:/^(https?:|data:|blob:)/i.test(v)?[v]:commonsURLs(v),cap,off:false};
}
function imgURLs(thumb){
  if(!thumb)return [];
  const clean=thumb.split('?')[0];
  const urls=[clean.replace(/\/\d+px-/,'/800px-'),clean];
  const m=clean.match(/\/thumb\/[^/]+\/[^/]+\/([^/]+)$/)||clean.match(/\/thumb\/[^/]+\/[^/]+\/([^/]+)\//);
  if(m)urls.push('https://en.wikipedia.org/wiki/Special:Redirect/file/'+m[1]+'?width=800',
                 'https://en.wikipedia.org/w/index.php?title=Special:Redirect/file/'+m[1]+'&width=800');
  return [...new Set(urls)];
}
function loadFirst(urls,ok,fail){
  let i=0,j=0;
  const next=()=>{
    if(i>=urls.length)return viaBlob();
    const u=urls[i++],im=new Image();
    im.onload=()=>ok(im,u);im.onerror=next;im.src=u;
  };
  /* if <img> is blocked outright, try fetching the bytes and rendering a blob */
  const viaBlob=()=>{
    if(j>=urls.length)return fail();
    const src=urls[j++];
    fetch(src,{mode:'cors'}).then(r=>r.ok?r.blob():Promise.reject())
      .then(bl=>{const u=URL.createObjectURL(bl),im=new Image();
        im.onload=()=>ok(im,src);im.onerror=viaBlob;im.src=u})
      .catch(viaBlob);
  };
  next();
}
function wiki(slug){
  if(slug in WC)return Promise.resolve(WC[slug]);
  const API='https://en.wikipedia.org/api/rest_v1/page/', q=encodeURIComponent(slug);
  return fetch(API+'summary/'+q+'?redirect=true')
    .then(r=>r.ok?r.json():null)
    .then(j=>{
      const o={thumb:(j&&j.thumbnail&&j.thumbnail.source)||null,desc:(j&&j.description)||null,
               file:null,ok:null};
      if(o.thumb){WC[slug]=o;return o}
      return fetch(API+'media-list/'+q)
        .then(r=>r.ok?r.json():null)
        .then(m=>{const it=((m&&m.items)||[]).find(x=>x.type==='image'&&x.showInGallery);
          if(it)o.file=it.title;WC[slug]=o;return o})
        .catch(()=>{WC[slug]=o;return o});
    })
    .catch(()=>{WC[slug]=null;return null});
}
function siteTipHTML(s){
  const w=WC[s.w],ov=override(s.n),
        src=ov.off?null:((w&&w.ok)||ov.urls[0]||(w&&w.thumb)||
             (w&&w.file?commonsURLs(w.file)[0]:null));
  return (src?`<img src="${src}" alt="">`:'')
    +`<b>${s.n}</b><span class="tr">${s.role}</span><i>${s.c}</i>`
    +`<em>${span(s)}</em>`

}

const BRK=[[-10000,0],[-6000,.10],[-4000,.20],[-3000,.30],[-2000,.44],[-1000,.58],
           [0,.70],[500,.79],[1000,.88],[1600,1]];
function y2t(y){y=Math.max(-10000,Math.min(1600,y));
  for(let i=0;i<BRK.length-1;i++){const[a,pa]=BRK[i],[b,pb]=BRK[i+1];
    if(y<=b)return pa+(pb-pa)*(y-a)/(b-a)}return 1}
function t2y(t){t=Math.max(0,Math.min(1,t));
  for(let i=0;i<BRK.length-1;i++){const[a,pa]=BRK[i],[b,pb]=BRK[i+1];
    if(t<=pb)return Math.round(a+(b-a)*(t-pa)/(pb-pa))}return 1600}

      const l=y2t(f)*100,w=Math.max(y2t(t)*100-l,1.2);
      h+=`<button class="cradle" data-k="${k}" aria-current="false">
        <span class="row"><span class="cn">${c.n}</span><span class="cc">${ss.filter(x=>x.ti===1).length?ss.filter(x=>x.ti===1).length+' major &middot; ':''}${ss.length} site${ss.length>1?'s':''}</span></span>
        <span class="span"><i style="left:${l.toFixed(1)}%;width:${w.toFixed(1)}%"></i></span></button>`;
    });
  });
  pBody.innerHTML=h;
  pBody.querySelectorAll('.cradle').forEach(b=>{
    const kk=b.dataset.k;
    b.addEventListener('pointerenter',()=>lightSys(kk));
    b.addEventListener('focus',()=>lightSys(kk));
    b.addEventListener('click',()=>{
      const c=CRADLE[kk],ss=c.sites;
      followRiver(kk);
    });
  });
}
function renderCard(s){
  const c=CRADLE[s.r], sib=c.sites.filter(o=>o!==s), url='https://en.wikipedia.org/wiki/'+s.w;
  sheetLabel.textContent=s.n;
  pKick.textContent=c.reg;
  pBody.innerHTML=`<div class="card">
    <p class="kicker">On the ${c.hy.replace(/^the /i,'')}</p>
    <h2>${s.n}</h2>
    <p class="role">${s.role}</p>
    <p class="culture">${s.c}</p>
    <div class="shot" id="shot"><span class="cap" id="cap">Loading image&hellip;</span></div>
    <p class="desc" id="desc"></p>
    <dl class="dl">
      <div><dt>Active</dt><dd>${span(s)}</dd></div>
      ${s.pop?`<div><dt>Peak size</dt><dd>${s.pop} people</dd></div>`:''}
      <div><dt>Water</dt><dd>${c.n}${c.dry?' <span style="color:var(--fog)">(now dry)</span>':''}</dd></div>
      <div><dt>Position</dt><dd>${Math.abs(s.la).toFixed(2)}&deg;${s.la<0?'S':'N'}, ${Math.abs(s.lo).toFixed(2)}&deg;${s.lo<0?'W':'E'}</dd></div>
    </dl>
    <p class="note">${s.d}</p>
    <div class="tagrow">${s.g.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    <a class="wlink" href="${url}" target="_blank" rel="noopener">Read on Wikipedia &rarr;</a>
    ${sib.length?`<p class="reg">Also on this water</p><div class="chips">${sib.map(o=>`<button class="chip" data-n="${o.n}">${o.n}</button>`).join('')}</div>`:''}
    <button class="back" id="backBtn">&larr; All cradles</button></div>`;
  pBody.scrollTop=0;
  const shot=$('#shot'),cap=$('#cap'),ov=override(s.n);
  if(ov.off)shot.remove();
  wiki(s.w).then(w=>{
    if(cur!==s)return;
    if(w&&w.desc)$('#desc').textContent=w.desc;
    if(ov.off)return;
    const urls=[...ov.urls,...imgURLs(w&&w.thumb),...(w&&w.file?commonsURLs(w.file):[])];
    if(!urls.length){
      shot.classList.add('empty');
      cap.innerHTML='No image available &mdash; <a href="'+url+'" target="_blank" rel="noopener">see the article</a>. '
        +'Supply your own in the IMG map.';
      return;
    }
    loadFirst(urls,(im,u)=>{
      if(w)w.ok=u;
      if(cur!==s){return}
      im.alt=s.n+' — image';im.className='';
      shot.insertBefore(im,cap);
      requestAnimationFrame(()=>im.classList.add('in'));
      cap.textContent=ov.urls.includes(u)?(ov.cap||'Supplied image'):'Image via Wikipedia';
    },()=>{
      if(cur!==s)return;
      shot.classList.add('empty');
      cap.innerHTML='Image did not load &mdash; <a href="'+url+'" target="_blank" rel="noopener">see the article</a>. '
        +'Supply your own in the IMG map.';
    });
  });
  pBody.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
    const o=SITE.find(x=>x.n===b.dataset.n);pick(o,true)}));
  $('#backBtn').addEventListener('click',()=>pick(null));
}
$('#sheetTab').addEventListener('click',()=>$('#panel').classList.toggle('open'));

/* ============ author tools ============ */
window.imageAudit=async function(){
  const rows=[];
  for(const s of SITE){
    const w=await wiki(s.w), ov=override(s.n);
    rows.push({site:s.n,slug:s.w,
      wikipediaImage:w&&w.thumb?'yes':'NONE',
      override:ov.off?'hidden':(ov.urls.length?'set':'')});
  }
  const gaps=rows.filter(r=>r.wikipediaImage==='NONE');
  say('table', rows);
  say('info', gaps.length+' of '+SITE.length+' sites have no Wikipedia image: '
    +gaps.map(r=>r.site).join(', ')
    +'. Add entries to the IMG block to supply your own.');
  return rows;
};
say('info', '%cRivers first, cities after', 'font-weight:bold',
  '\u2014 to change a photograph, edit the IMG data block in this file. Run imageAudit() to list sites with no image.');

/* ============ boot ============ */
$('#tally').innerHTML=Object.keys(CRADLE).length+' river systems &middot; '+SITE.length+' cities and cultures<br>10,000 BCE &ndash; 1600 CE';
renderList();
if(innerWidth<=900)$('#panel').classList.add('open');
pBody.addEventListener('pointerleave',()=>{if(!cur)lightSys(null)});
fit(false);
addEventListener('resize',()=>fit(false));

function clearDash(){BASEPATHS.forEach(p=>{p.style.strokeDasharray='';p.style.strokeDashoffset='';p.style.transition='none'});apply(false)}
if(reduce || !DRAW_ON_LOAD){
  clearDash();
  if(SWEEP_ON_LOAD && !reduce)play(9000);
  booted = true;
}else{
  gMark.classList.add('bloom');
  requestAnimationFrame(()=>{
    BASEPATHS.forEach((p,i)=>{p.style.transitionDelay=(i%9)*0.055+0.15+'s';p.style.strokeDashoffset=0});
    setTimeout(()=>{
      BASEPATHS.forEach(p=>p.style.transitionDelay='');
      gMark.classList.remove('bloom');
      MK.forEach(s=>{s._dot.style.transitionDelay=(s._i*0.012).toFixed(2)+'s'});
      setTimeout(clearDash,1700);
      if(SWEEP_ON_LOAD)play(9000);
      booted = true;
      setTimeout(()=>MK.forEach(s=>s._dot.style.transitionDelay=''),1600);
    },1250);
  });
}
</script>
